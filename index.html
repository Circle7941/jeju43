    background-size: cover;
    background-position: center;
    filter: blur(30px);

  async function saveAnswer(tableName, answer) {

    if (!visitorName || !answer) {
      return;
    }

    try {

      const response = await fetch(
        `${SUPABASE_BASE_URL}/${tableName}`,
        {
          method: "POST",

          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": `Bearer ${SUPABASE_KEY}`,
            "Content-Type": "application/json",
            "Prefer": "return=minimal"
          },

          body: JSON.stringify({
            session_id: sessionId,
            visitor_name: visitorName,
            answer: answer
          })
        }
      );

      if (!response.ok) {

        const errorText = await response.text();

        console.error(
          `Supabase 저장 실패 [${tableName}]`,
          response.status,
          errorText
        );
      }

    } catch (error) {

      console.error(
        `Supabase 연결 오류 [${tableName}]`,
        error
      );

    }
  }

  // =========================================================
  // 화면 초기화
  // =========================================================

  function resetVisuals() {

    background.style.backgroundImage = "none";
    background.style.backgroundColor = "#d9d9d9";

    background.classList.remove("red-scene");

    overlay.style.background = "transparent";

    dateEl.textContent = "";
    storyEl.textContent = "";
    choicesEl.innerHTML = "";

    footnoteEl.hidden = true;
    footnoteEl.textContent = "";

    app.onclick = null;
    app.style.cursor = "default";
  }


  // =========================================================
  // 이름 치환
  // =========================================================

  function personalize(text) {

    return String(text || "").replaceAll(
      "{name}",
      `${visitorName}씨`
    );

  }


  // =========================================================
  // 장면 이동
  // =========================================================

  function go(stepName) {

    currentStep = stepName;

    const scene = story[stepName];

    resetVisuals();


    if (stepName === "start") {

      app.classList.add("start");

    } else {

      app.classList.remove("start");

    }


    dateEl.textContent = scene.date || "";


    if (scene.bg) {

      background.style.backgroundImage =
        `url("${images[scene.bg]}")`;

      if (scene.red) {
        background.classList.add("red-scene");
      }

    }


    if (scene.red) {

      overlay.style.background =
        "rgba(120, 0, 0, .58)";

    }


    if (scene.footnote) {

      footnoteEl.textContent = scene.footnote;
      footnoteEl.hidden = false;

    }


    // ================================
    // 마지막 답변 정리 화면
    // ================================

    if (scene.summary) {

      renderSummary();
      return;

    }


    // ================================
    // 마지막 평가 화면
    // ================================

    if (scene.reflection) {

      renderReflection();
      return;

    }


    const rawText =
      personalize(scene.text || "");


    // ================================
    // 출처
    // ================================

    if (scene.end) {

      const lines = rawText.split("\n");

      lines.forEach((line, index) => {

        const el =
          document.createElement("span");

        el.className =
          index === 0
            ? "source-title"
            : "source-line";

        el.textContent = line;

        storyEl.appendChild(el);

      });

      renderEndHint();

    }

    // ================================
    // 일반 본문
    // ================================

    else {

      rawText.split("\n").forEach((line) => {

        const sentence =
          document.createElement("span");

        sentence.className = "sentence";

        if (line.trim().endsWith("?")) {
          sentence.classList.add("question-line");
        }

        sentence.textContent = line;

        storyEl.appendChild(sentence);

      });

    }


    // ================================
    // 이름 입력
    // ================================

    if (scene.type === "name") {

      renderNameInput();
      return;

    }


    // ================================
    // 텍스트 입력
    // ================================

    if (scene.type === "text") {

      renderTextInput(scene);
      return;

    }


    // ================================
    // 사망 엔딩
    // ================================

    if (scene.type === "death") {

      const button =
        createButton("다시하기");

      button.addEventListener(
        "click",
        (event) => {

          event.stopPropagation();

          sessionId =
            crypto.randomUUID();

          selectedChoiceText = "";
          uprisingChoiceText = "";
          descentChoiceText = "";

          policeMessage = "";
          governmentMessage = "";
          finalImpression = "";

          go(scene.retry);

        }
      );

      choicesEl.appendChild(button);

      return;

    }


    // ================================
    // 선택지
    // ================================

    if (scene.choices) {

      scene.choices.forEach(choice => {

        const button =
          createButton(choice.text);

        button.addEventListener(
          "click",
          async (event) => {

            event.stopPropagation();


            // 첫번째 선택
            if (currentStep === "s1") {

              selectedChoiceText =
                choice.text;

              await saveAnswer(
                "jeju43_choice_stone",
                choice.text
              );

            }


            // 무장봉기 선택
            if (currentStep === "s6") {

              uprisingChoiceText =
                choice.text;

              await saveAnswer(
                "jeju43_uprising_choice",
                choice.text
              );

            }


            // 내려갈지 여부
            if (currentStep === "s16") {

              descentChoiceText =
                choice.text;

              await saveAnswer(
                "jeju43_descent_choice",
                choice.text
              );

            }


            go(choice.next);

          }
        );

        choicesEl.appendChild(button);

      });

      return;

    }


    // ================================
    // 일반 장면
    // 아무 곳이나 클릭
    // 기록하지 않음
    // ================================

    if (scene.next) {

      const hint =
        document.createElement("div");

      hint.className = "click-hint";

      hint.textContent =
        "아무 곳이나 클릭하여 넘어가기";

      choicesEl.appendChild(hint);


      app.style.cursor = "pointer";

      app.onclick = () => {

        app.onclick = null;

        app.style.cursor = "default";

        go(scene.next);

      };

    }

  }


  // =========================================================
  // 이름 입력
  // =========================================================

  function renderNameInput() {

    app.onclick = null;
    app.style.cursor = "default";


    const form =
      document.createElement("form");

    form.className = "text-form";


    form.addEventListener(
      "click",
      event => event.stopPropagation()
    );


    const input =
      document.createElement("input");

    input.type = "text";
    input.maxLength = 50;
    input.required = true;
    input.placeholder = "이름을 입력하세요";


    input.setAttribute(
      "aria-label",
      "이름"
    );


    const button =
      createButton("시작");

    button.type = "submit";


    form.appendChild(input);
    form.appendChild(button);


    form.addEventListener(
      "submit",
      (event) => {

        event.preventDefault();


        const value =
          input.value.trim();


        if (!value) {

          alert("답변하고 넘어가라고!");

          return;

        }


        visitorName = value;

        sessionId =
          crypto.randomUUID();


        selectedChoiceText = "";
        uprisingChoiceText = "";
        descentChoiceText = "";

        policeMessage = "";
        governmentMessage = "";
        finalImpression = "";


        // 이름 자체는 저장하지 않음
        // 질문 답변에서 visitor_name으로 함께 저장됨

        go("s1");

      }
    );


    choicesEl.appendChild(form);

    input.focus();

  }


  // =========================================================
  // 텍스트 입력
  // =========================================================

  function renderTextInput(scene) {

    app.onclick = null;
    app.style.cursor = "default";


    const form =
      document.createElement("form");

    form.className =
      "text-form";


    form.addEventListener(
      "click",
      event => event.stopPropagation()
    );


    const textarea =
      document.createElement("textarea");

    textarea.maxLength = 5000;
    textarea.required = true;
    textarea.placeholder = "입력하세요";


    const button =
      createButton("확인");

    button.type = "submit";


    form.appendChild(textarea);
    form.appendChild(button);


    form.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();


        const value =
          textarea.value.trim();


        if (!value) {

          alert("답변하고 넘어가라고!");

          return;

        }


        // 경찰에게 하고 싶은 말
        if (scene.key === "police_message") {

          policeMessage = value;

          await saveAnswer(
            "jeju43_police_message",
            value
          );

        }


        // 정부에게 하고 싶은 말
        if (scene.key === "government_message") {

          governmentMessage = value;

          await saveAnswer(
            "jeju43_government_message",
            value
          );

        }


        // 마지막 소감
        if (scene.key === "final_impression") {

          finalImpression = value;

          await saveAnswer(
            "jeju43_final_impression",
            value
          );

        }


        go(scene.next);

      }
    );


    choicesEl.appendChild(form);

    textarea.focus();

  }


  // =========================================================
  // 조사
  // =========================================================

  function particleFor(text) {

    const clean =
      String(text || "")
        .trim()
        .replace(/[.!?,。！？~]+$/g, "");


    const last =
      clean.slice(-1);


    if (!last) {
      return "라고";
    }


    const code =
      last.charCodeAt(0);


    if (
      code >= 0xAC00 &&
      code <= 0xD7A3
    ) {

      return (
        ((code - 0xAC00) % 28) === 0
          ? "라고"
          : "이라고"
      );

    }


    return "이라고";

  }


  // =========================================================
  // 답변 정리
  // =========================================================

  function makeSummaryItem(
    question,
    answer
  ) {

    const wrap =
      document.createElement("div");

    wrap.className =
      "summary-item";


    const questionEl =
      document.createElement("div");

    questionEl.className =
      "summary-question";

    questionEl.textContent =
      question;


    const answerEl =
      document.createElement("div");

    answerEl.className =
      "summary-answer";

    answerEl.textContent =
      `- ${answer || "(답변 없음)"}`;


    wrap.append(
      questionEl,
      answerEl
    );


    return wrap;

  }


  function renderSummary() {

    const title =
      document.createElement("div");

    title.className =
      "summary-title";

    title.textContent =
      `${visitorName}씨의 선택`;


    storyEl.appendChild(title);


    storyEl.appendChild(
      makeSummaryItem(
        "당신의 행동은?",
        selectedChoiceText
      )
    );


    storyEl.appendChild(
      makeSummaryItem(
        "미친 경찰들에게 하고 싶은 말은?",
        policeMessage
      )
    );


    storyEl.appendChild(
      makeSummaryItem(
        "제주를 테러하는 정부에게 하고싶은 말은?",
        governmentMessage
      )
    );


    storyEl.appendChild(
      makeSummaryItem(
        "정부의 말을 믿을 수 없다면 어떤 선택을 했는가?",
        descentChoiceText
      )
    );


    storyEl.appendChild(
      makeSummaryItem(
        `지금까지 ${visitorName}씨의 소감은`,
        finalImpression
      )
    );


    const hint =
      document.createElement("div");

    hint.className =
      "click-hint";

    hint.textContent =
      "아무 곳이나 클릭하여 넘어가기";


    choicesEl.appendChild(hint);


    app.style.cursor =
      "pointer";


    app.onclick = () => {

      app.onclick = null;

      app.style.cursor =
        "default";

      go("reflection");

    };

  }


  // =========================================================
  // 마지막 문장
  // =========================================================

  function renderReflection() {

    const texts = [

      "다친 어린 아이를 외면하는 경찰을 부도덕적이라고 생각하는,",

      `합당하지 않은 행동을 하는 경찰들에게 "${policeMessage}" ${particleFor(policeMessage)} 외칠 수 있는,`,

      `사람들을 집단으로 학살하는 정부에게 "${governmentMessage}" ${particleFor(governmentMessage)} 말할 수 있는,`,

      "정부의 말을 믿지 않고 스스로 판단하여 행동하는,",

      "이 웹사이트를 구상한 사람이 대단하다고 생각하는,",

      `"${finalImpression}" ${particleFor(finalImpression)} 생각하는 ${visitorName}씨의 모습을 간직해주세요`

    ];


    texts.forEach(text => {

      const line =
        document.createElement("span");

      line.className =
        "sentence";

      line.textContent =
        text;

      storyEl.appendChild(line);

    });


    const hint =
      document.createElement("div");

    hint.className =
      "click-hint";

    hint.textContent =
      "아무거나 눌러서 끝내기";


    choicesEl.appendChild(hint);


    app.style.cursor =
      "pointer";


    app.onclick = () => {

      app.onclick = null;

      app.style.cursor =
        "default";

      go("end");

    };

  }


  // =========================================================
  // 출처
  // =========================================================

  function renderEndHint() {

    const hint =
      document.createElement("div");

    hint.className =
      "click-hint";

    hint.textContent =
      "아무거나 눌러서 끝내기";


    choicesEl.appendChild(hint);


    app.style.cursor =
      "pointer";


    app.onclick = () => {

      app.onclick = null;

      app.style.cursor =
        "default";

      go("start");

    };

  }


  // =========================================================
  // 버튼
  // =========================================================

  function createButton(text) {

    const button =
      document.createElement("button");

    button.type = "button";

    button.textContent =
      text;

    return button;

  }


  // =========================================================
  // 시작
  // =========================================================

  go("start");

</script>

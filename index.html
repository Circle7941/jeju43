<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>제주 4.3 선택형 이야기</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; }
  body {
    font-family: "Pretendard", "SUIT", "Noto Sans KR", "Malgun Gothic", Arial, sans-serif;
    background: #808080;
    color: #fff;
    overflow: hidden;
  }

  #app {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #808080;
  }

  #background {
    position: absolute;
    inset: 0;
    background: #ececec center center / contain no-repeat;
    z-index: 0;
    opacity: .72;
    filter: grayscale(72%) brightness(1.22) contrast(.78);
    transition: background-image .25s ease, opacity .25s ease, filter .25s ease;
  }

  #background.red-scene {
    opacity: 1;
    filter: none;
  }

  #overlay {
    position: absolute;
    inset: 0;
    background: transparent;
    z-index: 1;
    pointer-events: none;
    transition: background .25s ease;
  }

  #date {
    position: absolute;
    top: 22px;
    left: 26px;
    z-index: 5;
    font-size: 18px;
    font-weight: 700;
    text-shadow: 0 2px 8px rgba(0,0,0,.8);
  }

  #main {
    position: relative;
    z-index: 4;
    width: min(900px, calc(100% - 40px));
    height: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 92px 0 42px;
  }

  #story {
    width: 100%;
    padding: 22px 26px;
    border-radius: 0;
    background: rgba(20,20,20,.42);
    border: 1px solid rgba(255,255,255,.18);
    backdrop-filter: blur(2px);
    -webkit-backdrop-filter: blur(2px);
    font-size: clamp(18px, 2.2vw, 25px);
    line-height: 1.8;
    text-align: center;
    white-space: normal;
    text-shadow: 0 2px 8px rgba(0,0,0,.85);
    overflow-y: auto;
  }

  #choices {
    width: 100%;
    margin-top: 22px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  button {
    width: 100%;
    border: 1px solid rgba(255,255,255,.28);
    border-radius: 0;
    padding: 15px 18px;
    background: rgba(20,20,20,.58);
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: background .15s ease, transform .15s ease;
  }

  button:hover {
    background: rgba(20,20,20,.76);
  }

  .text-form {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  input, textarea {
    width: 100%;
    border: 1px solid rgba(255,255,255,.35);
    border-radius: 0;
    padding: 14px 15px;
    outline: none;
    background: rgba(255,255,255,.95);
    color: #111;
    font: inherit;
  }

  input:focus, textarea:focus {
    border-color: #fff;
    box-shadow: 0 0 0 3px rgba(255,255,255,.14);
  }

  textarea {
    min-height: 140px;
    resize: vertical;
  }

  #footnote {
    position: fixed;
    right: 22px;
    bottom: 18px;
    z-index: 6;
    width: min(480px, calc(100% - 44px));
    font-size: 12px;
    line-height: 1.5;
    text-align: right;
    text-shadow: 0 2px 8px rgba(0,0,0,.9);
  }

  .start #main {
    justify-content: center;
    padding-top: 0;
  }

  .start #story {
    background: transparent;
    border: none;
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
    font-size: clamp(22px, 3vw, 34px);
  }

  .start #choices {
    width: min(620px, 100%);
    margin-top: 18px;
  }

  @media (max-width: 640px) {
    #date { top: 14px; left: 16px; font-size: 15px; }
    #main { width: min(92%, 900px); padding-top: 68px; }
    #story { padding: 17px 16px; font-size: 18px; }
    button { padding: 14px 12px; }
    #footnote { right: 12px; bottom: 12px; width: calc(100% - 24px); }
  }
</style>
</head>
<body>
<div id="app" class="start">
  <div id="background"></div>
  <div id="overlay"></div>
  <div id="date"></div>

  <main id="main">
    <div id="story"></div>
    <div id="choices"></div>
  </main>

  <div id="footnote" hidden></div>
</div>

<script>
  // ================================
  // Supabase 연결 정보
  // ================================
  const SUPABASE_REST_URL = "https://rzjwsizmzhokeyoqmzdj.supabase.co/rest/v1/jeju43_responses";
  const SUPABASE_KEY = "sb_publishable_5X3rSkRk1I4MqBqWDwNMUg_nkmsExb-";

  // ================================
  // 화면 요소
  // ================================
  const app = document.getElementById("app");
  const background = document.getElementById("background");
  const overlay = document.getElementById("overlay");
  const dateEl = document.getElementById("date");
  const storyEl = document.getElementById("story");
  const choicesEl = document.getElementById("choices");
  const footnoteEl = document.getElementById("footnote");

  // ================================
  // 이미지 경로
  // index.html과 같은 폴더에 images 폴더를 두세요.
  // ================================
  const images = {
    1: "images/image1.png",
    2: "images/image2.png",
    3: "images/image3.png",
    4: "images/image4.png",
    5: "images/image5.png",
    6: "images/image6.png"
  };

  let currentStep = "start";
  let visitorName = "";
  let sessionId = crypto.randomUUID();

  // ================================
  // Supabase에 기록 저장
  // ================================
  async function saveEvent(eventType, answerKey = null, answerText = null, step = currentStep) {
    if (!visitorName) return;

    const payload = {
      session_id: sessionId,
      visitor_name: visitorName,
      step: stepNumber(step),
      event_type: eventType,
      answer_key: answerKey,
      answer_text: answerText
    };

    try {
      await fetch(SUPABASE_REST_URL, {
        method: "POST",
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${SUPABASE_KEY}`,
          "Content-Type": "application/json",
          "Prefer": "return=minimal"
        },
        body: JSON.stringify(payload)
      });
    } catch (error) {
      console.error("Supabase 저장 오류:", error);
    }
  }

  function stepNumber(step) {
    const order = [
      "start", "s1", "death1", "s2", "s3", "s4", "s5", "s6", "s7a", "s7b",
      "s8", "s9", "s10", "s11", "s12", "s13", "s14", "s15", "s16", "death2",
      "s17", "s18", "end"
    ];
    const index = order.indexOf(step);
    return index === -1 ? 0 : index;
  }

  // ================================
  // 스토리
  // ================================
  const story = {
    start: {
      date: "",
      text: "제주 4.3 사건의 피해자인 당신의 이름은?",
      type: "name"
    },

    s1: {
      date: "1947.03.01",
      bg: 1,
      text: "3.1절 기념 행사 후 시위를 하던 중 한 아이가 기마경찰의 말에 부딪혀 다쳤습니다 당신의 행동은?",
      choices: [
        { text: "짱돌을 주워 저 머저리 기마경찰에게 던진다", value: "stone_throw", next: "s2" },
        { text: "'내가 말이 된다' 나도 아이를 밟는다", value: "step_on_child", next: "death1" }
      ]
    },

    death1: {
      date: "1947.03.01",
      bg: 1,
      text: "당신은 제주 주민들에게 짱돌을 맞아 죽었습니다",
      type: "death",
      retry: "s1"
    },

    s2: {
      date: "1947.03.01",
      bg: 1,
      text: "주변 사람들도 당신을 따라 경찰에게 짱돌을 투척하기 시작했습니다",
      next: "s3"
    },

    s3: {
      date: "1947.03.01",
      bg: 2,
      text: "미친 경찰들이 당신들에게 총을 쏘기 시작했습니다",
      next: "s4"
    },

    s4: {
      date: "1947.03.01",
      bg: 2,
      text: "미친 경찰들의 총질로 제주 주민 6명이 희생되었습니다 당신은 개빡쳤습니다 미친 경찰들에게 하고 싶은 말은?",
      type: "text",
      key: "police_message",
      next: "s5"
    },

    s5: {
      date: "1948.04.03",
      bg: 3,
      red: true,
      text: "3월 1일에 주민 6명이 사망한 것에 항의하여 제주에서 민간인과 공공기관 모두 총파업(3.10 총파업) 중입니다",
      next: "s6"
    },

    s6: {
      date: "1948.04.03",
      bg: 3,
      red: true,
      text: "제주도의 총파업을 보고 미친 미국은 제주도를 '붉은섬', 즉 빨갱이 섬, 극좌 섬으로 낙인 찍습니다 육지에서 경찰들이 파견되고 극우청년단체가 제주에서 경찰, 행정기관 등을 장악하고 테러를 하고 다닙니다",
      choices: [
        { text: "개빡치네, 무장봉기를 일으킨다", value: "armed_uprising", next: "s7a" },
        { text: "찐따처럼 그냥 테러 당한다", value: "endure_terror", next: "s7b" }
      ]
    },

    s7a: {
      date: "1948.04.03",
      bg: 3,
      red: true,
      text: "당신을 따라 남로당 제주도당이 무장봉기를 시작합니다",
      next: "s8"
    },

    s7b: {
      date: "1948.04.03",
      bg: 3,
      red: true,
      text: "어쩌라고, 당신과 다른 생각을 가진 사람들이 무장봉기를 일으킵니다",
      next: "s8"
    },

    s8: {
      date: "1948.04.03",
      bg: 3,
      red: true,
      text: "한라산에서 붉은 봉화가 타오르며 무장봉기가 시작되었습니다",
      next: "s9"
    },

    s9: {
      date: "해안선으로부터 5KM",
      bg: 4,
      text: "우익청년단의 방화 사건(오라리사건)이 일어났습니다 경찰은 오라리사건을 제주무장단의 방화로 몰아갔습니다",
      next: "s10"
    },

    s10: {
      date: "해안선으로부터 5KM",
      bg: 4,
      text: "제주무장단은 5.10 선거의 무효를 위해 주민들을 산으로 보냈습니다 그 결과 전국에서 제주도의 2개의 선거구에서만 투표수 미달로 무효가 되었습니다",
      next: "s11"
    },

    s11: {
      date: "해안선으로부터 5KM",
      bg: 4,
      text: "미국은 이것을 정부 수립을 방해하는 세력으로 보고 검거작전 후 재선거를 시행했지만 실패했습니다",
      next: "s12"
    },

    s12: {
      date: "해안선으로부터 5KM",
      bg: 4,
      text: "제주도에 대한 강경 진압이 이루어지고 주민들이 대거 희생되었습니다",
      next: "s13"
    },

    s13: {
      date: "해안선으로부터 5KM",
      bg: 4,
      text: "10월 11일 제주에 경비사령부가 설치되고 해안선으로부터 5KM 이상 들어간 중산간지대를 통행하는 자는 총살하겠다는 명령이 떨어졌습니다 그 후 토벌대는 중산간지대의 마을에 불을 지르고 주민들을 집단으로 살해했습니다 제주를 테러하는 정부에게 하고싶은 말은?",
      footnote: "*중산간지대: 해안지대와 산악지대의 중간에 위치한 지역",
      type: "text",
      key: "government_message",
      next: "s14"
    },

    s14: {
      date: "1948.11.17 계엄령",
      bg: 5,
      text: "테러가 시작된지 40일이 다 되어갈 때쯤 제주에 계엄령이 선포되었습니다",
      next: "s15"
    },

    s15: {
      date: "1948.11.17 계엄령",
      bg: 5,
      text: "계엄령이 선포되고 중산간지대를 초토화시킨 대규모 진압이 시작되었습니다",
      next: "s16"
    },

    s16: {
      date: "1948.11.17 계엄령",
      bg: 5,
      text: "정부에서는 \"산에서 내려와 귀순하면 과거 행적을 묻지 않고 살려주겠다\" 고 했습니다",
      choices: [
        { text: "믿고 내려간다", value: "trust_and_descend", next: "death2" },
        { text: "믿을 수 없다. 안내려간다", value: "dont_trust", next: "s17" }
      ]
    },

    death2: {
      date: "1948.11.17 계엄령",
      bg: 5,
      text: "그걸 믿냐, 당신은 총살당했습니다",
      type: "death",
      retry: "s15"
    },

    s17: {
      date: "끝",
      bg: 6,
      text: "1954년 9월 21일 한라산 출입금지 지역이 개방되고 수많은 주민들의 희생을 남긴 채 제주 4.3 사건은 약 7년 7개월만에 끝이 났습니다",
      next: "s18"
    },

    s18: {
      date: "끝",
      bg: 6,
      text: "지금까지 당신의 소감은",
      type: "text",
      key: "final_impression",
      next: "end"
    },

    end: {
      date: "끝",
      bg: 6,
      text: "이미지 출처\n강요배- 3.1 대시위 / 강요배- 발포 / https://commons.wikimedia.org/wiki/File:Jeju_Island.jpg /\n제주도 메이데이 / 제주4.3평화재단- 중산간 지대로 피신한 주민들과 아이들 / 제주 4.3 화해보고서"
    }
  };

  // ================================
  // 화면 초기화
  // ================================
  function resetVisuals() {
    background.style.backgroundImage = "none";
    background.style.backgroundColor = "#ececec";
    background.classList.remove("red-scene");
    overlay.style.background = "transparent";
    dateEl.textContent = "";
    storyEl.textContent = "";
    choicesEl.innerHTML = "";
    footnoteEl.hidden = true;
    footnoteEl.textContent = "";
  }

  // ================================
  // 장면 이동
  // ================================
  function go(stepName) {
    currentStep = stepName;
    const scene = story[stepName];

    resetVisuals();

    if (stepName === "start") {
      app.classList.add("start");
    } else {
      app.classList.remove("start");
    }

    dateEl.textContent = scene.date || "";
    storyEl.textContent = scene.text || "";

    if (scene.bg) {
      background.style.backgroundImage = `url("${images[scene.bg]}")`;
      if (scene.red) background.classList.add("red-scene");
    }

    if (scene.red) {
      overlay.style.background = "rgba(120, 0, 0, .58)";
    }

    if (scene.footnote) {
      footnoteEl.textContent = scene.footnote;
      footnoteEl.hidden = false;
    }

    if (scene.type === "name") {
      renderNameInput();
      return;
    }

    if (scene.type === "text") {
      renderTextInput(scene);
      return;
    }

    if (scene.type === "death") {
      const button = createButton("다시하기");
      button.addEventListener("click", async (event) => {
        event.stopPropagation();
        await saveEvent("restart", "restart", "다시하기", currentStep);
        sessionId = crypto.randomUUID();
        go(scene.retry);
      });
      choicesEl.appendChild(button);
      return;
    }

    if (scene.choices) {
      scene.choices.forEach(choice => {
        const button = createButton(choice.text);
        button.addEventListener("click", async (event) => {
          event.stopPropagation();
          await saveEvent("choice", choice.value, choice.text, currentStep);
          go(choice.next);
        });
        choicesEl.appendChild(button);
      });
      return;
    }

    if (scene.next) {
      app.style.cursor = "pointer";
      app.onclick = async () => {
        app.onclick = null;
        app.style.cursor = "default";
        await saveEvent("continue", "continue", "continue", currentStep);
        go(scene.next);
      };
    }

    if (stepName === "end") {
      saveEvent("finish", "finish", "완료", stepName);
    }
  }

  // ================================
  // 이름 입력
  // ================================
  function renderNameInput() {
    const form = document.createElement("form");
    form.className = "text-form";

    const input = document.createElement("input");
    input.type = "text";
    input.maxLength = 50;
    input.required = true;
    input.placeholder = "이름을 입력하세요";
    input.setAttribute("aria-label", "이름");

    const button = createButton("시작");
    button.type = "submit";

    form.appendChild(input);
    form.appendChild(button);

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const value = input.value.trim();
      if (!value) {
        alert("답변하고 넘어가라고!");
        return;
      }

      visitorName = value;
      sessionId = crypto.randomUUID();
      await saveEvent("name", "visitor_name", visitorName, "start");
      go("s1");
    });

    choicesEl.appendChild(form);
    input.focus();
  }

  // ================================
  // 텍스트 답변 입력
  // ================================
  function renderTextInput(scene) {
    const form = document.createElement("form");
    form.className = "text-form";

    const textarea = document.createElement("textarea");
    textarea.maxLength = 5000;
    textarea.required = true;
    textarea.placeholder = "입력하세요";

    const button = createButton("확인");
    button.type = "submit";

    form.appendChild(textarea);
    form.appendChild(button);

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const value = textarea.value.trim();
      if (!value) {
        alert("답변하고 넘어가라고!");
        return;
      }

      await saveEvent("text", scene.key, value, currentStep);
      go(scene.next);
    });

    choicesEl.appendChild(form);
    textarea.focus();
  }

  function createButton(text) {
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = text;
    return button;
  }

  // 시작
  go("start");
</script>
</body>
</html>
